<section class="card mx-auto max-w-md p-6 sm:p-8">
  <h1 class="page-title">{{ 'health.title' | t }}</h1>
  <div class="mt-6 flex min-h-12 items-center">
    @switch (view()) {
      @case ('loading') {
        <mat-spinner diameter="32" />
      }
      @case ('healthy') {
        <p class="flex items-center gap-3 text-zinc-700">
          <mat-icon class="!text-emerald-600">check_circle</mat-icon> {{ 'health.ok' | t }}
        </p>
      }
      @case ('degraded') {
        <p class="flex items-center gap-3 text-zinc-700">
          <mat-icon class="!text-amber-600">warning</mat-icon> {{ 'health.degraded' | t }}
        </p>
      }
      @case ('unreachable') {
        <p class="flex items-center gap-3 text-zinc-700">
          <mat-icon class="!text-red-600">error</mat-icon> {{ 'health.down' | t }}
        </p>
      }
    }
  </div>
  <button matButton="outlined" class="mt-6" (click)="health.reload()">{{ 'health.checkAgain' | t }}</button>
</section>
