<section class="card mx-auto max-w-md p-6 sm:p-8">
  <h1 class="page-title">System status</h1>
  <div class="mt-6 flex min-h-12 items-center">
    @switch (view()) {
      @case ('loading') {
        <mat-spinner diameter="32" />
      }
      @case ('healthy') {
        <p class="flex items-center gap-3 text-zinc-700">
          <mat-icon class="!text-emerald-600">check_circle</mat-icon> API healthy, database connected
        </p>
      }
      @case ('degraded') {
        <p class="flex items-center gap-3 text-zinc-700">
          <mat-icon class="!text-amber-600">warning</mat-icon> API up, but the database is unreachable
        </p>
      }
      @case ('unreachable') {
        <p class="flex items-center gap-3 text-zinc-700">
          <mat-icon class="!text-red-600">error</mat-icon> API unreachable
        </p>
      }
    }
  </div>
  <button matButton="outlined" class="mt-6" (click)="health.reload()">Check again</button>
</section>
