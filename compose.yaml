# Production-like stack: docker compose -f compose.yaml up --build
# A plain `docker compose up` also applies compose.override.yaml (dev mode with hot reload).
name: store

services:
  mongo:
    # MongoDB 8.x refuses to start on Linux kernel 6.19+ (SERVER-121912); 7.0 is unaffected.
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/store}
      API_PORT: 3000
      # Required in this mode: the API refuses to start without a strong secret (see .env.example).
      SESSION_SECRET: ${SESSION_SECRET:-}
      # This stack serves plain HTTP on localhost; set to true when running behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Real payments through PayPal; without them, payments are simulated. Sandbox unless set to live.
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
