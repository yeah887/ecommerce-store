# Production-like stack: docker compose -f compose.yaml up --build
# A plain `docker compose up` also applies compose.override.yaml (dev mode with hot reload).
name: store

services:
  mongo:
    # MongoDB 8.x refuses to start on Linux kernel 6.19+ (SERVER-121912); 7.0 is unaffected.
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/store}
      API_PORT: 3000
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
